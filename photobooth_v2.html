<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>포토부스</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Jua&family=Great+Vibes&display=swap" rel="stylesheet">
<style>
:root{--bg:#f4f1ea;--fg:#1d2433;--card:#fff;--line:#d9d4c7;--pri:#9b1c1c;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#141a26;--fg:#f1eee6;--card:#1f2736;--line:#33405a;--pri:#d9534f}}
:root[data-theme="dark"]{--bg:#141a26;--fg:#f1eee6;--card:#1f2736;--line:#33405a;--pri:#d9534f}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--fg);font-family:"Jua","Apple SD Gothic Neo","Noto Sans KR",sans-serif}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:var(--bg);z-index:10}
section{min-height:100vh;padding:24px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:20px;text-align:center}
section[hidden]{display:none}
h1{font-family:"Great Vibes","Snell Roundhand","Apple Chancery",cursive;font-size:104px;line-height:1.05;margin:0;font-weight:400;color:#9b1c1c}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]) h1{color:#f0a9a4}}
p{margin:0;font-size:20px;opacity:.75}
button{font:inherit;font-size:22px;border:2px solid var(--line);background:var(--card);color:var(--fg);border-radius:18px;padding:14px 22px;min-height:56px}
button.on{border-color:var(--pri);background:var(--pri);color:#fff}
button:focus-visible{outline:3px solid var(--pri);outline-offset:2px}
.go{background:#9b1c1c;color:#fff;border:0;font-size:36px;padding:30px 64px;border-radius:28px}
#shoot{position:relative;overflow:hidden;background:#0b1530;color:#fff}
#shoot .bg{position:absolute;inset:0;width:100%;height:100%}
#shoot p{position:relative;z-index:1;opacity:.95;text-shadow:0 2px 10px rgba(0,0,0,.6);font-size:24px}
.cam{position:relative;z-index:1;height:min(70vh,720px);max-width:92vw;aspect-ratio:3/4;background:#000;border-radius:24px;overflow:hidden;box-shadow:0 0 0 6px rgba(255,236,170,.55),0 10px 50px rgba(0,0,0,.6)}
.cam video{width:100%;height:100%;object-fit:cover;transform:scaleX(-1)}
#cnt{position:absolute;inset:0;display:grid;place-items:center;font-size:200px;color:#fff;text-shadow:0 4px 24px rgba(0,0,0,.6)}
#fl{position:fixed;inset:0;background:#fff;opacity:0;pointer-events:none;transition:opacity .35s;z-index:20}
#result{flex-direction:row;flex-wrap:wrap;align-items:flex-start;justify-content:center}
#strip,#pv{height:min(84vh,980px);max-width:92vw;width:auto;border-radius:6px;box-shadow:0 6px 28px rgba(0,0,0,.28);background:#fff}
.panel{flex:1 1 320px;max-width:480px;display:flex;flex-direction:column;gap:12px;text-align:left}
.panel h2{margin:0;font-size:22px;font-weight:400;opacity:.8}
.row{display:flex;flex-wrap:wrap;gap:10px}
.row button{padding:10px 16px;font-size:20px}
.fchips button{padding:16px 22px;font-size:26px}
.note{font-size:16px;opacity:.65}
.settings{width:min(100%,600px);display:grid;gap:14px;text-align:left}.settings label{display:grid;gap:6px;font-size:18px}.settings input,.settings select{font:inherit;padding:9px;max-width:100%;min-height:42px}.settings input[type=range]{width:100%}.settings output{font-size:14px}.settings #cfgFrames{display:flex;flex-wrap:wrap;gap:10px}.settings #cfgFrames label{display:flex;align-items:center;font-size:16px}.stats{padding:15px;border:1px solid var(--line);border-radius:16px}.admin-entry{font-size:16px;min-height:40px;padding:8px 12px}#admin{justify-content:flex-start}#admin h2{margin:0}.panel .note{overflow-wrap:anywhere}
</style>
</head>
<body>
<section id="home">
  <h1>Merry Christmas</h1>
  <p>버튼을 누르면 3초 뒤에 사진이 찍혀요</p>
  <button class="go" id="startBtn" onclick="start()">촬영 시작</button>
  <button class="admin-entry" onclick="openAdmin()">관리자 설정</button>
  <p id="err" style="color:#c0392b;font-size:18px;opacity:1"></p>
</section>

<section id="shoot" hidden>
  <svg class="bg" viewBox="0 0 1600 900" preserveAspectRatio="xMidYMax slice" aria-hidden="true">
    <defs>
      <linearGradient id="sk" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#070d24"/><stop offset=".62" stop-color="#1c2f5e"/><stop offset="1" stop-color="#d28b3c"/></linearGradient>
      <radialGradient id="gl"><stop offset="0" stop-color="#fff3c4" stop-opacity=".95"/><stop offset="1" stop-color="#fff3c4" stop-opacity="0"/></radialGradient>
    </defs>
    <rect width="1600" height="900" fill="url(#sk)"/>
    <g fill="#fff" opacity=".85">
      <circle cx="120" cy="80" r="2.5"/><circle cx="260" cy="150" r="2"/><circle cx="380" cy="60" r="3"/><circle cx="520" cy="130" r="2"/><circle cx="640" cy="50" r="2.5"/><circle cx="760" cy="110" r="2"/><circle cx="880" cy="60" r="3"/><circle cx="1000" cy="140" r="2"/><circle cx="1480" cy="70" r="2.5"/><circle cx="1380" cy="210" r="2"/><circle cx="1540" cy="190" r="3"/><circle cx="60" cy="230" r="2"/><circle cx="450" cy="260" r="2"/><circle cx="980" cy="250" r="2"/>
    </g>
    <circle cx="1230" cy="170" r="170" fill="url(#gl)"/>
    <path d="M1230 50 L1244 156 L1350 170 L1244 184 L1230 290 L1216 184 L1110 170 L1216 156 Z" fill="#fff6d0"/>
    <path d="M1160 100 L1230 170 L1300 240 M1300 100 L1230 170 L1160 240" stroke="#fff6d0" stroke-width="3" opacity=".6"/>
    <g fill="#0a1128">
      <path d="M0 900 V470 H120 V560 H230 V520 H320 V620 H450 V700 H560 V900Z"/>
      <path d="M20 470 a40 40 0 0 1 80 0Z"/><path d="M135 560 a40 40 0 0 1 80 0Z"/><path d="M240 520 a30 30 0 0 1 60 0Z"/>
      <rect x="352" y="540" width="14" height="80"/><path d="M349 540 L359 510 L369 540Z"/>
      <path d="M1600 900 V500 H1480 V590 H1370 V540 H1290 V640 H1160 V720 H1060 V900Z"/>
      <path d="M1500 500 a40 40 0 0 1 80 0Z"/><path d="M1385 590 a40 40 0 0 1 80 0Z"/><path d="M1300 540 a30 30 0 0 1 60 0Z"/>
      <rect x="1214" y="560" width="14" height="80"/><path d="M1211 560 L1221 530 L1231 560Z"/>
      <path d="M0 900 V820 Q400 770 800 820 T1600 810 V900Z"/>
    </g>
    <g fill="#f6c453">
      <rect x="40" y="520" width="12" height="20" rx="6"/><rect x="70" y="600" width="12" height="20" rx="6"/><rect x="150" y="600" width="12" height="20" rx="6"/><rect x="180" y="650" width="12" height="20" rx="6"/><rect x="260" y="580" width="12" height="20" rx="6"/><rect x="350" y="650" width="12" height="20" rx="6"/><rect x="400" y="700" width="12" height="20" rx="6"/>
      <rect x="1540" y="560" width="12" height="20" rx="6"/><rect x="1500" y="640" width="12" height="20" rx="6"/><rect x="1420" y="640" width="12" height="20" rx="6"/><rect x="1390" y="690" width="12" height="20" rx="6"/><rect x="1320" y="600" width="12" height="20" rx="6"/><rect x="1230" y="680" width="12" height="20" rx="6"/><rect x="1180" y="740" width="12" height="20" rx="6"/>
    </g>
    <g stroke="#0a1128" stroke-width="10" fill="none" stroke-linecap="round">
      <path d="M520 830 Q528 760 515 700"/><path d="M515 700 q-40 -10 -60 25 M515 700 q40 -10 60 25 M515 700 q-30 -35 -62 -22 M515 700 q30 -35 62 -22"/>
      <path d="M1080 830 Q1072 770 1085 720"/><path d="M1085 720 q-40 -10 -60 25 M1085 720 q40 -10 60 25 M1085 720 q-30 -35 -62 -22 M1085 720 q30 -35 62 -22"/>
    </g>
    <path d="M740 830 L800 790 L860 830Z" fill="#0a1128"/>
    <circle cx="800" cy="822" r="30" fill="url(#gl)"/>
  </svg>
  <p>카메라를 보고 웃어주세요</p>
  <div class="cam"><video id="v" playsinline muted></video><div id="cnt"></div></div>
</section>

<section id="result" hidden>
  <div>
    <canvas id="strip"></canvas>
    <canvas id="pv" hidden></canvas>
  </div>
  <div class="panel">
    <h2>프레임을 골라주세요</h2>
    <div class="row fchips" id="fchips"></div>
    <div class="row"><button id="pvbtn" onclick="togglePv()">인쇄 미리보기</button></div>
    <p class="note" id="pvnote" hidden>프린터는 흑백 점으로 인쇄해요. 이 화면이 실제 출력 모양이에요.</p>
    <div class="row"><button onclick="start()">다시 찍기</button><button onclick="resetBooth()">처음으로</button></div>
    <div class="row"><button onclick="savePhoto(false)">사진 저장</button><button onclick="sharePhoto()">사진 공유</button><button onclick="savePhoto(true)">인쇄용 PNG 저장</button></div>
    <p class="note" id="resultStatus" role="status" aria-live="polite">P1 직접 자동 인쇄는 지원되지 않습니다. 인쇄용 이미지를 저장할 수 있습니다.</p>
  </div>
</section>
<section id="admin" hidden>
  <h2>관리자 설정</h2>
  <p class="note">설정은 이 iPad의 브라우저에만 저장됩니다. 관리자 화면은 보안 인증 화면이 아닙니다.</p>
  <div class="settings">
    <label>행사명 <input id="cfgName" maxlength="36" value="아름다운교회"></label>
    <label>촬영 카운트다운 (초) <input id="cfgCountdown" type="number" min="1" max="10" value="3"></label>
    <label>밝기 (-50 ~ 50) <input id="cfgBrightness" type="range" min="-50" max="50" value="0"><output id="valBrightness"></output></label>
    <label>대비 (-50 ~ 50) <input id="cfgContrast" type="range" min="-50" max="50" value="0"><output id="valContrast"></output></label>
    <label>감마 (0.5 ~ 1.8) <input id="cfgGamma" type="range" min="50" max="180" value="100"><output id="valGamma"></output></label>
    <label>디더링 <select id="cfgDither"><option value="floyd">Floyd–Steinberg</option><option value="threshold">단순 흑백</option></select></label>
    <label>성경 말씀 <select id="cfgVerse"><option value="random">랜덤</option><option value="fixed">고정</option><option value="none">표시 안 함</option></select></label>
    <label>고정 말씀 <select id="cfgFixed"></select></label>
    <label>자동 초기화 (초, 0=끄기) <input id="cfgTimeout" type="number" min="0" max="600" value="60"></label>
    <label>프레임 사용 <span id="cfgFrames"></span></label>
  </div>
  <div class="row"><button onclick="saveSettings()">설정 저장</button><button onclick="show('home')">취소</button></div>
  <div class="stats"><h2>이 기기의 촬영 통계</h2><p id="statsText"></p><button onclick="clearStats()">통계 초기화</button></div>
  <p class="note" id="adminStatus" role="status"></p>
</section>
<div id="fl"></div>

<script>
const CH="아름다운교회",EN="Beautiful Church";
const W=704,H=1480,PX=52,PY=200,PW=600,PH=800;
const $=id=>document.getElementById(id);
const sleep=ms=>new Promise(r=>setTimeout(r,ms));
const V=[
 ["오늘 다윗의 동네에 너희를 위하여 구주가 나셨으니 곧 그리스도 주시니라","누가복음 2:11"],
 ["지극히 높은 곳에서는 하나님께 영광이요 땅에서는 하나님이 기뻐하신 사람들 중에 평화로다","누가복음 2:14"],
 ["무서워하지 말라 보라 내가 온 백성에게 미칠 큰 기쁨의 좋은 소식을 너희에게 전하노라","누가복음 2:10"],
 ["이는 한 아기가 우리에게 났고 한 아들을 우리에게 주신 바 되었는데","이사야 9:6"],
 ["보라 처녀가 잉태하여 아들을 낳을 것이요 그 이름을 임마누엘이라 하리라","마태복음 1:23"],
 ["그의 이름을 예수라 하라 이는 그가 자기 백성을 그들의 죄에서 구원할 자이심이라","마태복음 1:21"],
 ["말씀이 육신이 되어 우리 가운데 거하시매","요한복음 1:14"],
 ["하나님이 세상을 이처럼 사랑하사 독생자를 주셨으니","요한복음 3:16"]
];

function star(x,cx,cy,r){x.beginPath();for(let i=0;i<10;i++){const a=-Math.PI/2+i*Math.PI/5,q=i%2?r*.42:r;x.lineTo(cx+q*Math.cos(a),cy+q*Math.sin(a))}x.closePath();x.fill()}
function snow(x,cx,cy,r){x.save();x.translate(cx,cy);x.lineWidth=Math.max(2,r/9);x.lineCap="round";
  for(let i=0;i<6;i++){x.rotate(Math.PI/3);x.beginPath();x.moveTo(0,0);x.lineTo(0,-r);x.moveTo(0,-r*.6);x.lineTo(-r*.24,-r*.84);x.moveTo(0,-r*.6);x.lineTo(r*.24,-r*.84);x.stroke()}x.restore()}
function tree(x,cx,t,w){for(let i=0;i<3;i++){const y=t+i*w*.38,ww=w*(.55+i*.22);x.beginPath();x.moveTo(cx,y);x.lineTo(cx+ww/2,y+w*.5);x.lineTo(cx-ww/2,y+w*.5);x.closePath();x.fill()}x.fillRect(cx-w*.07,t+w*1.14,w*.14,w*.2)}
function rr(x,a,b,w,h,r){x.beginPath();x.moveTo(a+r,b);x.arcTo(a+w,b,a+w,b+h,r);x.arcTo(a+w,b+h,a,b+h,r);x.arcTo(a,b+h,a,b,r);x.arcTo(a,b,a+w,b,r);x.closePath()}
function bauble(x,cx,cy,r){x.lineWidth=3;x.beginPath();x.moveTo(cx,36);x.lineTo(cx,cy-r);x.stroke();x.fillRect(cx-7,cy-r-8,14,10);
  x.beginPath();x.arc(cx,cy,r,0,7);x.fill();x.strokeStyle="#fff";x.lineWidth=4;x.beginPath();x.arc(cx,cy,r*.62,Math.PI*1.1,Math.PI*1.6);x.stroke();x.strokeStyle="#000"}
function border(x){x.lineWidth=6;rr(x,10,10,W-20,H-20,26);x.stroke();x.lineWidth=2;rr(x,24,24,W-48,H-48,16);x.stroke()}
function dots(x){x.lineWidth=3;let k=0;const g=36,m=24,P=(a,b)=>{x.beginPath();x.arc(a,b,8,0,7);(k++%2)?x.fill():x.stroke()};
  for(let a=m;a<=W-m;a+=g){P(a,m);P(a,H-m)}for(let b=m+g;b<=H-m-g;b+=g){P(m,b);P(W-m,b)}}
function key(x,cx,cy,a){x.save();x.translate(cx,cy);x.rotate(a);x.lineWidth=7;x.beginPath();x.arc(0,-34,15,0,7);x.stroke();x.fillRect(-3,-19,7,66);x.fillRect(4,28,14,6);x.fillRect(4,40,10,6);x.restore()}
function fish(x,cx,cy,s,d){x.save();x.translate(cx,cy);x.scale(d*s,s);x.beginPath();x.ellipse(0,0,34,16,0,0,7);x.fill();x.beginPath();x.moveTo(30,0);x.lineTo(54,-16);x.lineTo(54,16);x.closePath();x.fill();x.fillStyle="#fff";x.beginPath();x.arc(-18,-4,3.5,0,7);x.fill();x.restore()}
function sheep(x,cx,cy){x.beginPath();x.ellipse(cx,cy,18,11,0,0,7);x.fill();x.beginPath();x.arc(cx+20,cy-4,6,0,7);x.fill();x.fillRect(cx-10,cy+6,3,9);x.fillRect(cx+6,cy+6,3,9)}
function cross(x,cx,cy,s){x.fillRect(cx-3*s,cy-14*s,6*s,34*s);x.fillRect(cx-10*s,cy-5*s,20*s,6*s)}
function title(x,t,s,y1,y2,sz){x.font=(sz||56)+"px Jua, sans-serif";x.fillText(t,W/2,y1);x.font="26px Jua, sans-serif";x.fillText(s,W/2,y2)}

// 1 눈꽃 트리: 전구 점 테두리 + 별 + 눈 결정 + 트리
function f1(x){dots(x);star(x,W/2,74,32);title(x,"기쁘다 구주 오셨네","Joy to the World",134,178,52);
  snow(x,92,110,32);snow(x,W-92,110,32);
  [130,352,574].forEach(c=>tree(x,c,1010,70));snow(x,241,1062,24);snow(x,463,1062,24);snow(x,48,1062,14);snow(x,W-48,1062,14)}
// 2 캔디케인
function f2(x){
  x.save();x.beginPath();x.rect(0,0,W,H);x.rect(36,36,W-72,H-72);x.clip("evenodd");
  for(let i=-H;i<W+H;i+=30){x.beginPath();x.moveTo(i,0);x.lineTo(i+15,0);x.lineTo(i+15+H,H);x.lineTo(i+H,H);x.closePath();x.fill()}
  x.restore();x.lineWidth=3;x.strokeRect(36,36,W-72,H-72);
  title(x,"Merry Christmas","임마누엘 · 하나님이 우리와 함께하시도다",108,160,62);
  bauble(x,92,100,22);bauble(x,W-92,100,22);star(x,W/2-170,1058,10);star(x,W/2+170,1058,10)}
// 3 아기 예수: 마구간 장면
function f3(x){border(x);star(x,W/2,66,32);title(x,"아기 예수 나심","베들레헴 마구간에서",126,176,56);
  x.fillRect(60,1104,584,3);star(x,120,1054,28);x.lineWidth=3;x.beginPath();x.moveTo(120,1010);x.lineTo(120,1020);x.moveTo(84,1054);x.lineTo(74,1054);x.moveTo(156,1054);x.lineTo(166,1054);x.stroke();
  x.beginPath();x.moveTo(236,1052);x.lineTo(352,1016);x.lineTo(468,1052);x.closePath();x.fill();
  x.lineWidth=5;x.beginPath();x.moveTo(258,1052);x.lineTo(258,1104);x.moveTo(446,1052);x.lineTo(446,1104);x.stroke();
  x.beginPath();x.moveTo(318,1086);x.lineTo(386,1086);x.lineTo(376,1104);x.lineTo(328,1104);x.closePath();x.fill();
  x.fillStyle="#fff";x.lineWidth=3;x.beginPath();x.ellipse(352,1084,24,8,0,0,7);x.fill();x.stroke();x.beginPath();x.arc(352,1070,9,0,7);x.fill();x.stroke();x.beginPath();x.ellipse(352,1058,13,4,0,0,7);x.stroke();
  x.fillStyle="#000";
  x.beginPath();x.arc(296,1064,10,0,7);x.fill();x.beginPath();x.moveTo(296,1072);x.lineTo(272,1104);x.lineTo(322,1104);x.closePath();x.fill();
  x.beginPath();x.arc(410,1056,9,0,7);x.fill();x.beginPath();x.moveTo(410,1064);x.lineTo(394,1104);x.lineTo(430,1104);x.closePath();x.fill();
  x.lineWidth=4;x.beginPath();x.moveTo(436,1046);x.lineTo(436,1104);x.stroke();
  sheep(x,540,1090);sheep(x,600,1096)}
// 4 베드로: 열쇠 + 물고기 + 배
function f4(x){border(x);title(x,"베드로","사람을 낚는 어부",104,160,70);
  key(x,100,112,-.6);key(x,100,112,.6);key(x,W-100,112,-.6);key(x,W-100,112,.6);
  x.lineWidth=4;x.beginPath();for(let a=60;a<=644;a+=4){const y=1100+Math.sin(a/14)*4;a===60?x.moveTo(a,y):x.lineTo(a,y)}x.stroke();
  x.beginPath();x.moveTo(250,1072);x.lineTo(454,1072);x.lineTo(424,1100);x.lineTo(280,1100);x.closePath();x.fill();
  x.lineWidth=5;x.beginPath();x.moveTo(352,1072);x.lineTo(352,1018);x.stroke();
  x.beginPath();x.moveTo(358,1022);x.lineTo(358,1066);x.lineTo(414,1066);x.closePath();x.fill();
  x.lineWidth=3;x.beginPath();x.moveTo(346,1030);x.lineTo(346,1066);x.lineTo(306,1066);x.closePath();x.stroke();
  fish(x,140,1060,1,1);fish(x,100,1092,.7,1);fish(x,W-140,1058,1,-1);fish(x,W-100,1090,.7,-1)}
// 5 교회: 예배당 풍경
function f5(x){border(x);cross(x,96,100,1.6);cross(x,W-96,100,1.6);title(x,"함께 예배해요","Let us worship together",104,160,62);
  x.fillRect(60,1104,584,3);

const FR=[{n:"눈꽃 트리",d:f1,r:28},{n:"캔디케인",d:f2,r:0},{n:"아기 예수",d:f3,r:20},{n:"베드로",d:f4,r:20},{n:"교회",d:f5,r:20}];
const DEFAULTS={name:CH,countdown:3,brightness:0,contrast:0,gamma:100,dither:"floyd",verseMode:"random",fixedVerse:0,timeout:60,frames:[0,1,2,3,4]};
const SETTINGS_KEY="beautifulchurch.photobooth.settings.v2",STATS_KEY="beautifulchurch.photobooth.stats.v2";
function stored(key,fallback){try{const data=JSON.parse(localStorage.getItem(key));return data&&typeof data==="object"?data:fallback}catch(e){return fallback}}
function clamp(n,min,max,def){n=Number(n);return Number.isFinite(n)?Math.max(min,Math.min(max,n)):def}
function normalizeSettings(raw){const a={...DEFAULTS,...raw};a.name=String(a.name||CH).slice(0,36);a.countdown=clamp(a.countdown,1,10,3);a.brightness=clamp(a.brightness,-50,50,0);a.contrast=clamp(a.contrast,-50,50,0);a.gamma=clamp(a.gamma,50,180,100);a.timeout=clamp(a.timeout,0,600,60);a.fixedVerse=clamp(a.fixedVerse,0,V.length-1,0);a.frames=Array.isArray(a.frames)?a.frames.filter(i=>Number.isInteger(i)&&i>=0&&i<FR.length):DEFAULTS.frames.slice();if(!a.frames.length)a.frames=[0];if(!["random","fixed","none"].includes(a.verseMode))a.verseMode="random";if(!["floyd","threshold"].includes(a.dither))a.dither="floyd";return a}
let cfg=normalizeSettings(stored(SETTINGS_KEY,DEFAULTS));
let stats=stored(STATS_KEY,{shots:0,frames:{}});
let fi=0,shot=null,verse=V[0],stream=null,busy=false,session=0,idleTimer=null,currentScreen="home";
function persistStats(){try{localStorage.setItem(STATS_KEY,JSON.stringify(stats))}catch(e){}}
function show(id){currentScreen=id;["home","shoot","result","admin"].forEach(s=>$(s).hidden=s!==id);scheduleReset()}
function scheduleReset(){clearTimeout(idleTimer);if(currentScreen==="result"&&cfg.timeout>0&&!busy)idleTimer=setTimeout(resetBooth,cfg.timeout*1000)}
function touchResult(){if(currentScreen==="result")scheduleReset()}
function resetBooth(){session++;busy=false;clearTimeout(idleTimer);shot=null;window.printBitmap=null;$("v").pause();if(stream){stream.getTracks().forEach(t=>t.stop());stream=null;$("v").srcObject=null}$("cnt").textContent="";$("startBtn").disabled=false;show("home")}
function chooseVerse(){if(cfg.verseMode==="fixed")return V[cfg.fixedVerse];return V[Math.floor(Math.random()*V.length)]}
function openAdmin(){if(busy)return;show("admin");$("cfgName").value=cfg.name;$("cfgCountdown").value=cfg.countdown;$("cfgBrightness").value=cfg.brightness;$("cfgContrast").value=cfg.contrast;$("cfgGamma").value=cfg.gamma;$("cfgDither").value=cfg.dither;$("cfgVerse").value=cfg.verseMode;$("cfgTimeout").value=cfg.timeout;$("cfgFixed").innerHTML="";V.forEach((v,i)=>{const o=document.createElement("option");o.value=i;o.textContent=v[1]+" · "+v[0].slice(0,20);$("cfgFixed").appendChild(o)});$("cfgFixed").value=cfg.fixedVerse;$("cfgFrames").innerHTML="";FR.forEach((f,i)=>{const l=document.createElement("label"),c=document.createElement("input");c.type="checkbox";c.value=i;c.checked=cfg.frames.includes(i);l.append(c,document.createTextNode(f.n));$("cfgFrames").appendChild(l)});["Brightness","Contrast","Gamma"].forEach(k=>{const inp=$("cfg"+k),out=$("val"+k);out.textContent=k==="Gamma"?(inp.value/100).toFixed(2):inp.value;inp.oninput=()=>out.textContent=k==="Gamma"?(inp.value/100).toFixed(2):inp.value});renderStats()}
function saveSettings(){const frames=[...$("cfgFrames").querySelectorAll("input:checked")].map(e=>Number(e.value));if(!frames.length){$("adminStatus").textContent="프레임을 하나 이상 선택하세요.";return}cfg=normalizeSettings({name:$("cfgName").value,countdown:$("cfgCountdown").value,brightness:$("cfgBrightness").value,contrast:$("cfgContrast").value,gamma:$("cfgGamma").value,dither:$("cfgDither").value,verseMode:$("cfgVerse").value,fixedVerse:$("cfgFixed").value,timeout:$("cfgTimeout").value,frames});try{localStorage.setItem(SETTINGS_KEY,JSON.stringify(cfg))}catch(e){$("adminStatus").textContent="브라우저 저장에 실패했습니다.";return}show("home")}
function renderStats(){$("statsText").textContent="완료된 촬영: "+(stats.shots||0)+"회 · 프레임 선택: "+FR.map((f,i)=>f.n+" "+((stats.frames||{})[i]||0)+"회").join(" / ")}
function clearStats(){if(!confirm("이 iPad의 촬영 통계를 초기화할까요?"))return;stats={shots:0,frames:{}};persistStats();renderStats()}
function recordFrame(){stats.frames=stats.frames||{};stats.frames[fi]=(stats.frames[fi]||0)+1;persistStats()}


async function start(){
  if(busy)return;
  busy=true;const token=++session;clearTimeout(idleTimer);$("startBtn").disabled=true;$("err").textContent="";
  try{
    if(!stream||!stream.active){stream=await navigator.mediaDevices.getUserMedia({video:{facingMode:"user",width:{ideal:1280},height:{ideal:960}},audio:false});$("v").srcObject=stream}
    if(token!==session)return;
    show("shoot");const v=$("v");await v.play();
    if(!v.videoWidth)await new Promise((resolve,reject)=>{const t=setTimeout(()=>reject(new Error("카메라 영상 준비 시간 초과")),6000);v.addEventListener("loadeddata",()=>{clearTimeout(t);resolve()},{once:true})});
    for(let n=cfg.countdown;n>0;n--){if(token!==session)return;$("cnt").textContent=n;await sleep(1000)}
    if(token!==session)return;
    $("cnt").textContent="";flash();shot=grab();await sleep(300);
    try{await document.fonts.load("52px Jua")}catch(e){}
    if(token!==session)return;
    verse=chooseVerse();fi=cfg.frames[0];buildPanel();draw();
    $("pv").hidden=true;$("strip").hidden=false;$("pvnote").hidden=true;$("pvbtn").textContent="인쇄 미리보기";
    stats.shots=(stats.shots||0)+1;persistStats();recordFrame();
    show("result");
  }catch(e){if(token===session){show("home");$("err").textContent="카메라를 사용할 수 없어요 ("+(e?.name||e?.message||"오류")+"). 카메라 권한을 확인해 주세요."}}
  finally{if(token===session){busy=false;$("startBtn").disabled=false;scheduleReset()}}
}
function flash(){const f=$("fl");f.style.opacity=1;setTimeout(()=>f.style.opacity=0,120)}
function grab(){
  const v=$("v"),w=640,h=854,c=document.createElement("canvas");c.width=w;c.height=h;
  const x=c.getContext("2d"),vw=v.videoWidth,vh=v.videoHeight,r=w/h;
  let sw=vw,sh=vw/r;if(sh>vh){sh=vh;sw=vh*r}
  x.translate(w,0);x.scale(-1,1);x.drawImage(v,(vw-sw)/2,(vh-sh)/2,sw,sh,0,0,w,h);return c
}
function wrap(x,t,mw){const o=[];let l="";for(const w of t.split(" ")){const n=l?l+" "+w:w;if(x.measureText(n).width>mw&&l){o.push(l);l=w}else l=n}o.push(l);return o}

  const f=FR[fi],c=$("strip"),x=c.getContext("2d");

function buildPanel(){
  $("fchips").innerHTML="";

function togglePv(){
  const on=$("pv").hidden;$("pv").hidden=!on;$("strip").hidden=on;$("pvnote").hidden=!on;
  $("pvbtn").textContent=on?"편집으로 돌아가기":"인쇄 미리보기";if(on)dither();touchResult()

function dither(){
  const s=$("strip"),w=384,h=Math.round(s.height*w/s.width),o=$("pv");
  o.width=w;o.height=h;const x=o.getContext("2d",{willReadFrequently:true});x.drawImage(s,0,0,w,h);
  const d=x.getImageData(0,0,w,h),p=d.data,g=new Float32Array(w*h);
  const contrast=(259*(255+cfg.contrast*2))/(255*(259-cfg.contrast*2));
  for(let i=0;i<w*h;i++){
    let l=.299*p[i*4]+.587*p[i*4+1]+.114*p[i*4+2];
    l=Math.max(0,Math.min(255,l+cfg.brightness*2));
    l=Math.max(0,Math.min(255,contrast*(l-128)+128));
    g[i]=255*Math.pow(l/255,100/cfg.gamma);
  }
  for(let y=0;y<h;y++)for(let u=0;u<w;u++){
    const i=y*w+u,old=Math.max(0,Math.min(255,g[i])),n=old<128?0:255,e=old-n;g[i]=n;
    if(cfg.dither==="threshold")continue;
    if(u+1<w)g[i+1]+=e*7/16;
    if(y+1<h){if(u>0)g[i+w-1]+=e*3/16;g[i+w]+=e*5/16;if(u+1<w)g[i+w+1]+=e/16}
  }
  for(let i=0;i<w*h;i++){p[i*4]=p[i*4+1]=p[i*4+2]=g[i];p[i*4+3]=255}
  x.putImageData(d,0,0);window.printBitmap=o;
}
function canvasBlob(canvas){return new Promise((resolve,reject)=>canvas.toBlob(blob=>blob?resolve(blob):reject(new Error("이미지 생성 실패")),"image/png"))}
async function photoFile(print=false){if(!shot)throw new Error("촬영된 사진이 없습니다.");if(print)dither();const blob=await canvasBlob(print?$("pv"):$("strip"));return new File([blob],"beautiful-church-"+Date.now()+(print?"-print":"")+".png",{type:"image/png"})}
function status(msg){$("resultStatus").textContent=msg}

async function sharePhoto(){touchResult();try{const file=await photoFile(false);if(navigator.canShare?.({files:[file]})&&navigator.share){await navigator.share({files:[file],title:"아름다운교회 포토부스"});status("공유 시트를 닫았습니다.")}else{status("이 브라우저는 파일 공유를 지원하지 않습니다. 사진 저장을 이용하세요.")}}catch(e){if(e.name!=="AbortError")status("공유 실패: "+e.message)}}
